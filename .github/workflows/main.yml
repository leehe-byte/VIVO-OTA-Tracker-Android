name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main # push main 也编译一遍（只上传 artifact，不发 Release），便于随时确认构建是绿的
    tags:
      - 'v*' # 推送 v 开头的 tag 时编译并发布 Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode 要用 git rev-list --count HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 不用 android-actions/setup-android：它会去装已被下架的 'tools' 包。
      # ubuntu-latest 镜像自带 Android SDK，这里只补齐本项目需要的平台。
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true

      # 本项目 compileSdk = 37（minor 2），托管 runner 镜像里不一定有这个平台
      - name: Install required SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$SDK/platforms/android-37.2" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" || true
          fi
          if [ ! -d "$SDK/build-tools/36.0.0" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" || true
          fi
          echo "--- platforms after install ---"; ls "$SDK/platforms"
          # settings.gradle.kts 里没有 sdk.dir 的兜底，CI 上写一份 local.properties
          echo "sdk.dir=$SDK" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # keystore 以 base64 存在 Secret 里，落到 $RUNNER_TEMP 后转成 VOTA_* 环境变量。
      # 粘贴 base64 时经常会带上换行/空格，所以先把所有空白剥掉再解码；
      # 解码失败或口令不对要在这里就给出可诊断的错误，而不是让后面的 Gradle 神秘失败。
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_FILE secret 为空或不存在，请到 Settings -> Secrets and variables -> Actions 配置"
            exit 1
          fi

          CLEAN="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "secret 长度 ${#KEYSTORE_BASE64}，去掉空白后 ${#CLEAN}"

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$CLEAN" | base64 -d > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "::error::base64 解码失败。请用 [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore.jks')) 重新生成，只粘贴 base64 本体（不要前缀、不要文件名）"
            echo "前 24 个字符: $(printf '%s' "$CLEAN" | head -c 24)"
            exit 1
          fi

          SIZE="$(stat -c%s "$KEYSTORE_PATH")"
          echo "解码后大小 ${SIZE} bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::解码结果只有 ${SIZE} 字节，明显不是 keystore，请检查 Secret 内容"
            exit 1
          fi

          # 自检：这份 keystore 能否用给定的口令打开、别名是否存在
          if ! keytool -list -keystore "$KEYSTORE_PATH" \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::keystore 已解出，但用 KEYSTORE_PASSWORD / KEY_ALIAS 打不开，请核对这两个 Secret"
            exit 1
          fi
          echo "keystore 校验通过"

          echo "VOTA_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        env:
          VOTA_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOTA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOTA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 让 Gradle Plugin Portal 的 AGP marker 代理指向正确构件
          MAVEN_GROUP: com.android.tools.build
          MAVEN_NAME: gradle
          MAVEN_VERSION: 9.2.1
          # tag 构建用 tag 名做 versionName
          VOTA_VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./gradlew assembleRelease

      - name: Prepare Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="nightly-$(git rev-parse --short HEAD)"
          fi

          OUTPUT_NAME="VIVO-OTA-Tracker-Android-${VERSION}.apk"
          mkdir -p final_artifacts
          cp app/build/outputs/apk/release/*.apk "final_artifacts/${OUTPUT_NAME}"

          echo "FINAL_FILENAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VIVO OTA Tracker ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📱 VIVO OTA Tracker ${{ env.VERSION }}

            在手机上查询 vivo 官方 OTA 固件下载直链的 Android 应用。
            界面是**液态玻璃**（Kyant backdrop，AGSL 真折射），背景支持 **Bing 每日一图** /
            **本地图片** / **内置色块**三种。

            ### 功能

            - 查询官方 OTA：填 SW_MODEL / DEVICE_MODEL / 当前版本，直接拿到固件直链、文件名、大小、更新日志
            - 「读取本机」：从 `ro.build.*` 自动读出本机机型与版本参数
            - 完整包 / 增量包切换，verbose 模式可看明文请求与解密后的原始响应
            - 背景三选一，切换带玻璃滑块动画；Bing 每日一图跟随官方 API，跨天自动换

            ### 说明

            - 最低 Android 8.0（API 26）；`lens()` 真折射需要 **Android 13 / API 33+**，低版本自动降级为模糊
            - 查询接口沿用原 Python 项目的 TLS 行为（**不校验服务端证书**），Bing 图片链路正常校验
            - 仅供技术学习与交流，请勿用于任何非法或商业用途

            实现细节、协议对照与踩坑记录见 [README](https://github.com/${{ github.repository }}#readme)。

            ---

            本次构建产物：`${{ env.FINAL_FILENAME }}`
          files: final_artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_FILENAME }}
          path: final_artifacts/*.apk
          retention-days: 7
